<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cedar Valley Lodge App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: a demo stage (moment rail + device) on desktop; the bare app, full-bleed, on a phone.
   --brand and --accent swap for white-label; everything else is neutral iOS-style. */
:root{
  --stage:#eceff1; --bg:#f2f3f5; --surface:#ffffff; --fill:#eceef1; --fg:#111518; --fg2:#5f676e; --fg3:#9aa1a7; --line:rgba(17,21,24,.09);
  --brand:#213368; --brand-2:#94a545; --accent:#213368; --on-brand:#ffffff; --on-accent:#ffffff; --brand-tint:#e6e9f2;
  --ok:#1f8a55; --ok-tint:#e4f4eb; --red:#d6333b; --star:#f2a20c; --device:#101214;
  --f:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif; --sb:54px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --stage:#0a0c0d; --bg:#000000; --surface:#151719; --fill:#1f2225; --fg:#f2f4f5; --fg2:#a3abb1; --fg3:#6c757c; --line:rgba(255,255,255,.08);
  --brand:#33498f; --brand-2:#a9bc5a; --accent:#8ea2e0; --on-accent:#0d1530; --brand-tint:#161d33; --ok:#45c482; --ok-tint:#10291c; --red:#ff5a5f; --device:#2a2d30; color-scheme:dark } }
:root[data-theme="dark"]{ --stage:#0a0c0d; --bg:#000000; --surface:#151719; --fill:#1f2225; --fg:#f2f4f5; --fg2:#a3abb1; --fg3:#6c757c; --line:rgba(255,255,255,.08);
  --brand:#33498f; --brand-2:#a9bc5a; --accent:#8ea2e0; --on-accent:#0d1530; --brand-tint:#161d33; --ok:#45c482; --ok-tint:#10291c; --red:#ff5a5f; --device:#2a2d30; color-scheme:dark }
/* Client: its own look. Always dark, warm amber accent, its own typeface. */
:root[data-brand="client"]{ --stage:#0b0c0e; --bg:#0b0c0e; --surface:#17181b; --fill:#222327; --fg:#f4f1ec; --fg2:#a7a29a; --fg3:#6d6964; --line:rgba(255,255,255,.07);
  --brand:#f0a33a; --brand-2:#f0a33a; --accent:#f0a33a; --on-brand:#1a1206; --on-accent:#1a1206; --brand-tint:#2a2013; --ok:#5fd08f; --ok-tint:#132a1d; --red:#ff6b5e; --star:#f0a33a; --device:#26272b;
  --f:"Manrope",-apple-system,BlinkMacSystemFont,system-ui,sans-serif; color-scheme:dark }

:root[data-brand="client"] .pass{background:linear-gradient(150deg,#2b241a,#141416);color:var(--fg);box-shadow:inset 0 0 0 1px rgba(240,163,58,.28)}
:root[data-brand="client"] .pass small{color:var(--accent)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  display:flex;justify-content:center;align-items:center;gap:56px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
p,.cell .t span,.note{text-wrap:pretty}

/* stage rail */
.rail{width:220px;display:flex;flex-direction:column;gap:28px}
.rail h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.rail .sub{color:var(--fg2);font-size:13px;margin-top:4px}
.seg2{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg2 button{flex:1;text-align:center;font-size:13px;font-weight:600;padding:7px 0;border-radius:8px;color:var(--fg2)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.moments{display:flex;flex-direction:column;gap:2px}
.moments button{display:flex;gap:12px;align-items:baseline;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:500}
.moments button:hover{background:var(--fill)}
.moments button span{color:var(--fg3);font-variant-numeric:tabular-nums;font-size:12px;width:14px}

/* device */
.device{width:393px;height:852px;flex:none;border-radius:62px;padding:11px;background:var(--device);box-shadow:0 0 0 1.5px #3a3e42,0 40px 80px -30px rgba(0,0,0,.45);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:30}
.status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font-weight:600;font-size:16px;z-index:20;position:absolute;inset:0 0 auto;pointer-events:none}
.status:not(.light){background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.status.light{color:#fff}
.status svg{height:12px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--fg);opacity:.85;z-index:40;pointer-events:none}
@media (max-width:860px){ .rail{display:none} }
@media (max-width:500px){
  :root{--sb:0px}
  body{padding:0;display:block}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{border-radius:0}
  .island,.status,.homebar{display:none}
}

/* app chrome */
.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:var(--sb) 0 28px;background:var(--bg);scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.in{animation:pushIn .32s cubic-bezier(.2,.8,.2,1)}
.view.back{animation:popIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pushIn{from{transform:translateX(36%);opacity:.4}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-18%);opacity:.6}to{transform:none;opacity:1}}
.pad{padding:0 18px}
.stack{display:flex;flex-direction:column;gap:22px}
.navbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;height:44px;padding:0 10px;margin-bottom:8px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.navbar .backbtn{display:flex;align-items:center;gap:4px;color:var(--accent);font-size:17px;padding:6px;white-space:nowrap}
.navbar .backbtn svg{width:13px;height:22px;flex:none}
.navbar .ttl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:600;font-size:17px;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg);position:relative}
.iconbtn svg{width:22px;height:22px}
.iconbtn .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.large{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 18px 2px}
.large h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.large small{display:block;color:var(--fg2);font-size:13px;font-weight:500;margin-bottom:4px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px 28px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);z-index:6}
@media (max-width:500px){ .tabbar{padding-bottom:max(10px,env(safe-area-inset-bottom,0px))} .view{padding-top:env(safe-area-inset-top,0px)} .navbar{top:0} }
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--fg3)}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:26px;height:26px}

/* content */
.h2{display:flex;justify-content:space-between;align-items:baseline;padding:0 18px;margin-bottom:-10px}
.h2 h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0}
.h2 button{color:var(--accent);font-size:15px;font-weight:500}
.group{background:var(--surface);border-radius:14px;margin:0 18px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;min-height:52px;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,14px);border-top:.5px solid var(--line)}
.cell .t{flex:1;min-width:0}
.cell .t b{display:block;font-weight:600;font-size:16px}
.cell .t span{display:block;color:var(--fg2);font-size:13px;margin-top:1px}
.cell .chev{color:var(--fg3);width:8px;flex:none}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;overflow:hidden;background:var(--fill);position:relative}
.thumb>.ph,.shero>.ph{width:100%;height:100%}
.thumb img,.ph img{width:100%;height:100%;object-fit:cover}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,var(--brand-2)))}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.75)}
.ph .fb svg{width:34%;height:34%;max-width:44px;max-height:44px}
.ph img{position:relative;z-index:1}
.glyph{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--brand);color:var(--on-brand)}
.glyph svg{width:18px;height:18px}
.vstat{font-size:13px;color:var(--fg2);font-weight:500;white-space:nowrap}
.vstat.closed{color:var(--fg3)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--ok-tint);color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--fill);color:var(--fg2);margin:4px 4px 0 0}
.tag.me{background:var(--ok-tint);color:var(--ok)}
.tag.no{background:none;color:var(--red);padding-left:0}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px}
.btn.alt{background:var(--fill);color:var(--fg)}
.btn:disabled{opacity:.35}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);font-size:15px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.chipsep{flex:none;width:1px;margin:7px 2px;background:var(--line)}
.chip.filter{display:flex;align-items:center;gap:6px;background:none;box-shadow:inset 0 0 0 1px var(--line)}
.chip.filter svg{width:0;height:16px;transition:width .2s}
.chip.filter[aria-pressed="true"]{background:var(--accent);box-shadow:none}
.chip.filter[aria-pressed="true"] svg{width:16px}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--fg2);padding:0 32px;margin-top:-14px}

/* home */
.hero{margin:0 18px;border-radius:20px;overflow:hidden;position:relative;height:236px;color:#fff;background:#24343a}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.72))}
.hero .in{position:absolute;inset:auto 0 0;padding:16px;z-index:1;display:flex;flex-direction:column;gap:8px}
.hero small{opacity:.85;font-size:13px;font-weight:500}
.hero .room{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero .pill{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);width:max-content}
.hero .pill.ok{background:#1f8a55}
.rail-x{display:flex;gap:12px;overflow-x:auto;padding:0 18px;scroll-snap-type:x mandatory;scroll-padding-inline:18px;scrollbar-width:none}
.rail-x::-webkit-scrollbar{display:none}
.vcard{flex:none;width:156px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.vcard .ph{height:116px;border-radius:14px}
.vcard b{font-size:15px;font-weight:600;display:block}
.live{margin:0 18px;background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.live .top{display:flex;gap:12px;align-items:center}
.live .top .t{flex:1;min-width:0}
.live .top b{font-weight:700;display:block}
.live .top span{color:var(--fg2);font-size:13px}
.eta{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.bar i{height:5px;border-radius:3px;background:var(--fill)}
.bar i.on{background:var(--ok)}
.time{width:62px;flex:none;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.time small{display:block;font-size:10px;letter-spacing:.02em;color:var(--fg3);font-weight:600;text-transform:uppercase}

/* venue / item */
.cover{height:220px;margin-top:calc(var(--sb) * -1);position:relative}
.cover .ph{position:absolute;inset:0}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 45%);pointer-events:none}
.floatnav{position:absolute;top:calc(var(--sb) + 4px);left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.round{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.round svg{width:18px;height:18px}
.vhead{padding:16px 18px 0;display:flex;flex-direction:column;gap:6px}
.vhead h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.vhead .meta{display:flex;gap:8px;align-items:center;color:var(--fg2);font-size:13px;flex-wrap:wrap}
.vhead p{margin:4px 0 0;color:var(--fg2)}
.banner2{margin:0 18px;display:flex;align-items:center;gap:10px;background:var(--brand-tint);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:500}
.banner2 svg{width:20px;height:20px;flex:none}
.item{display:flex;gap:12px;padding:14px;width:100%;position:relative;align-items:flex-start}
.item+.item::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--line)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .t b{font-weight:600;font-size:16px}
.item .t p{margin:0;color:var(--fg2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .plus{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--fg);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:2;font-size:20px;line-height:1}
.item.nofit .t,.item.nofit .thumb{opacity:.45}
.station{color:var(--fg3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cartpill{position:sticky;bottom:10px;margin:0 18px;z-index:4}
.cartpill .btn{justify-content:space-between;padding:0 18px;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.cartpill .n{background:rgba(255,255,255,.22);border-radius:8px;padding:2px 8px;font-size:15px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-radius:22px 22px 0 0;z-index:51;transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--fg3);opacity:.5;margin:7px auto 0;position:absolute;left:0;right:0;z-index:3}
.sheet .body{overflow-y:auto;padding-bottom:20px;scrollbar-width:none}
.sheet .foot{padding:12px 18px 30px;background:var(--bg);border-top:.5px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet .shero{height:210px}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;width:100%}
.opt+.opt::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--line)}
.opt .t{flex:1}
.opt .t small{display:block;color:var(--fg2);font-size:13px}
.opt .mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--fg3);display:grid;place-items:center;flex:none}
.opt .mark.sq{border-radius:6px}
.opt[aria-checked="true"] .mark{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt .mark svg{width:13px;height:13px;opacity:0}
.opt[aria-checked="true"] .mark svg{opacity:1}
.opt:disabled{opacity:.35}
.glabel{display:flex;justify-content:space-between;padding:0 32px 6px;font-size:13px;color:var(--fg2);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.upsell{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scrollbar-width:none;scroll-snap-type:x mandatory}
.ucard{flex:none;width:122px;background:var(--surface);border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column;scroll-snap-align:start;transition:box-shadow .15s}
.ucard[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.ucard .ph{height:96px}
.ucard .t{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.ucard .t b{font-weight:600;line-height:1.25}
.ucard .t span{color:var(--fg2)}
.ucard .add{position:absolute;top:80px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:19px;font-weight:600;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:2}
.ucard[aria-pressed="true"] .add{background:var(--accent);color:var(--on-accent)}
.ucard .add svg{width:14px;height:14px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:12px;height:50px;padding:0 6px;flex:none}
.stepper button{width:34px;height:34px;display:grid;place-items:center;font-size:20px;border-radius:8px}
.stepper span{min-width:18px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* booking */
.days{display:flex;gap:8px;overflow-x:auto;padding:0 18px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;height:66px;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day small{font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase}
.day b{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.day[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 18px}
.slot{height:42px;border-radius:10px;background:var(--surface);font-weight:600;font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.slot:disabled{opacity:.3;text-decoration:line-through;cursor:default}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:0 18px;background:var(--surface);border-radius:14px}
.facts div{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts div+div{border-left:.5px solid var(--line)}
.facts small{font-size:11px;color:var(--fg2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.facts b{font-weight:600;font-size:15px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 24px 10px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.done .ok svg{width:30px;height:30px}
.done h3{margin:6px 0 0}
.done p{margin:0;color:var(--fg2)}

/* foodback */
.stars{display:flex;justify-content:center;gap:10px}
.stars button svg{width:40px;height:40px;color:var(--fill)}
.stars button.on svg{color:var(--star)}
textarea{width:100%;min-height:84px;border:0;border-radius:12px;background:var(--surface);padding:12px 14px;resize:none;font-size:15px}

/* pass */
.pass{margin:0 18px;border-radius:20px;padding:18px;color:var(--on-brand);background:linear-gradient(150deg,var(--brand),color-mix(in srgb,var(--brand) 70%,#000));display:flex;flex-direction:column;gap:16px;box-shadow:0 18px 30px -18px rgba(0,0,0,.5)}
.pass .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pass small{opacity:.75;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:block}
.pass b{font-size:16px;font-weight:600}
.pass .cap{text-wrap:balance;text-align:center;font-size:13px;opacity:.85;margin-top:-6px}
.qrbox{background:#fff;border-radius:12px;padding:10px;width:150px;height:150px;align-self:center}
.qrbox img,.qrbox canvas{width:100%!important;height:100%!important}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* banner */
.banner{position:absolute;top:10px;left:8px;right:8px;z-index:60;border-radius:22px;padding:12px 14px;display:flex;gap:11px;align-items:center;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 10px 30px -8px rgba(0,0,0,.35);transform:translateY(-140%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.25,1.1),visibility .45s}
.banner.on{transform:none;visibility:visible}
.banner .appi{width:38px;height:38px;border-radius:9px;overflow:hidden;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.06em;flex:none}
.banner .t{flex:1;min-width:0}
.banner .t b{font-weight:600;font-size:15px;display:block}
.banner .t span{font-size:13px;color:var(--fg2)}
.banner .when{font-size:12px;color:var(--fg2);align-self:flex-start}
@media (max-width:500px){ .banner{top:max(10px,env(safe-area-inset-top,0px))} }
@media (prefers-reduced-motion:reduce){ .view.in,.view.back{animation:none} .sheet,.banner,.scrim{transition:none} }

function notify(title, body){ const had = S.notes.some(n=>n.title===title && n.body===body);
  S.notes = S.notes.filter(n=>!(n.title===title && n.body===body)); S.notes.unshift({title, body, at:clock()}); if(!had) S.unread++;
  if(cur()?.view==='notes') soft();
  if(NOTE_CAT[title] && !S.toggles[NOTE_CAT[title]]) return;
  const b = $('#banner'); b.innerHTML = `<div class="appi">${appIcon()}</div><div class="t"><b>${esc(T(title))}</b><span>${esc(body)}</span></div><div class="when">${S.lang==='FR'?'maint.':'now'}</div>`;
  b.classList.add('on'); clearTimeout(b._t); b._t = setTimeout(()=>b.classList.remove('on'), 4200);
  const bell = document.querySelector('[data-bell]'); if(bell && !bell.querySelector('.dot')) bell.insertAdjacentHTML('beforeend','<span class="dot"></span>') }

/* item sheet with modifiers */
let draft = null;
function openItem(k, venue){ const it = ITEMS[k]; draft = {k, venue, q:1, sel:{}, drinks:new Set()};
  (MODS[it.mods]||[]).forEach((g,gi)=>{ draft.sel[gi] = g.one ? new Set([0]) : new Set() }); drawItem() }
function drawItem(){ const it = ITEMS[draft.k], groups = MODS[it.mods]||[], v = VENUES[draft.venue];
  const extra = groups.reduce((a,g,gi)=>a+[...draft.sel[gi]].reduce((s,oi)=>s+g.o[oi][1],0),0), total = (it.p+extra)*draft.q;
  const broken = new Set(groups.flatMap((g,gi)=>[...draft.sel[gi]].flatMap(oi=>g.o[oi][3]||[])));
  const f = it.nonfood?[]:fails(it.tags.filter(t=>!broken.has(t)));
  const ups = DRINKS.has(draft.k) || it.nonfood ? [] : (UPSELL[draft.venue]||[]).filter(d=>!fails(ITEMS[d].tags).length);
  const dsum = [...draft.drinks].reduce((a,d)=>a+ITEMS[d].p,0);
  const y = draft.keep ? ($('#sheet .body')||{}).scrollTop||0 : 0; draft.keep = 0;
  openSheet(`<div class="body">${it.img?`<div class="shero">${photo(it.img, v.icon)}</div>`:''}
    <div class="stack" style="gap:18px;padding-top:${it.img?16:30}px">
    <div class="pad"><h3>${esc(L(it))}</h3><p style="margin:6px 0 0;color:var(--fg2)">${esc(D(it))}</p><div>${f.length?notTag(f[0]):tagsHtml(it.tags)}</div></div>
    ${groups.map((g,gi)=>`<div><div class="glabel"><span>${T(g.g)}</span><span>${T(g.one?'Required':'Optional')}</span></div><div class="group">${g.o.map(([n,p,fr,br],oi)=>{ const base = fails(it.tags), of = br ? fails(it.tags.filter(t=>!br.includes(t))).filter(x=>!base.includes(x)) : []; return `<button class="opt" role="${g.one?'radio':'checkbox'}" aria-checked="${draft.sel[gi].has(oi)}" onclick="pick(${gi},${oi})" ${of.length?'style="opacity:.45"':''}><span class="mark ${g.one?'':'sq'}">${I.check}</span><span class="t">${S.lang==='FR'?fr:n}</span>${of.length?notTag(of[0]):''}${p?`<span style="color:var(--fg2)">+${money(p)}</span>`:''}</button>`}).join('')}</div></div>`).join('')}
    ${ups.length?`<div><div class="glabel"><span>${T('Add a drink?')}</span></div><div class="upsell">${ups.map(d=>{ const x=ITEMS[d], on=draft.drinks.has(d); return `<button class="ucard" aria-pressed="${on}" onclick="draft.keep=1;draft.drinks.has('${d}')?draft.drinks.delete('${d}'):draft.drinks.add('${d}');drawItem()">${photo(x.img,'cup')}<span class="add" aria-hidden="true">${on?I.check:'+'}</span><span class="t"><b>${esc(L(x))}</b><span>${money(x.p)}</span></span></button>` }).join('')}</div></div>`:''}
    ${it.alc?`<div class="pad" style="color:var(--fg2);font-size:13px">${T('Two drinks per order. ID checked on delivery.')}</div>`:''}
    </div></div>
    <div class="foot"><div class="stepper"><button aria-label="-" onclick="draft.q=Math.max(1,draft.q-1);drawItem()">−</button><span>${draft.q}</span><button aria-label="+" onclick="draft.q=Math.min(${it.alc?2:9},draft.q+1);drawItem()">+</button></div>
    <button class="btn" onclick="addDraft(${total})">${T('Add')} · ${money(total+dsum)}</button></div>`);
  if(y) $('#sheet .body').scrollTop = y }
function pick(gi, oi){ const g = MODS[ITEMS[draft.k].mods][gi]; draft.keep = 1; if(g.one) draft.sel[gi] = new Set([oi]); else draft.sel[gi].has(oi)?draft.sel[gi].delete(oi):draft.sel[gi].add(oi); drawItem() }
function addDraft(total){ const it = ITEMS[draft.k], groups = MODS[it.mods]||[];
  const notes = groups.flatMap((g,gi)=>[...draft.sel[gi]].map(oi=>S.lang==='FR'?g.o[oi][2]:g.o[oi][0])).filter(n=>!['Regular','Whole','Normales','Entier'].includes(n));
  if(S.cartVenue && S.cartVenue!==draft.venue){ S.cart = []; notify('New order started', vname(draft.venue)) }
  S.cartVenue = draft.venue; S.cart.push({n:L(it), q:draft.q, total, notes}); draft.drinks.forEach(d=>S.cart.push({n:L(ITEMS[d]), q:1, total:ITEMS[d].p, notes:[]})); closeSheet(); soft() }

V.checkout = () => { const v = S.cartVenue, ven = VENUES[v], t = S.cart.reduce((a,c)=>a+c.total,0), gst = Math.round(t*5)/100, tot = t+gst;
  const opts = v==='pub' ? [...(S.table?[S.table]:[]), T('Pick up at the bar'), T('Golf simulator · Bay 2')] : v==='room' ? [`${B().block} · ${T('Room')} 123`] : [T('Pick up at the counter')];

  const asap = S.when==='As soon as possible';
  return `${navbar('Checkout')}<div class="stack">
  <div class="group">${S.cart.map(c=>`<div class="cell"><span style="color:var(--fg2);font-weight:600;width:22px">${c.q}×</span><div class="t"><b>${esc(c.n)}</b>${c.notes.length?`<span>${esc(c.notes.join(', '))}</span>`:''}</div><span class="price">${money(c.total)}</span></div>`).join('')}</div>

  <div><div class="glabel"><span>${T('Pay with')}</span></div><div class="group">${[['Apple Pay',I.apay],[T('Visa ending 4242'),'']].map(([n,ic],i)=>`<button class="opt" role="radio" aria-checked="${S.pay===i}" onclick="S.pay=${i};soft()"><span class="mark">${I.check}</span><span class="t" style="display:flex;gap:6px;align-items:center">${ic}${n}</span></button>`).join('')}</div></div>
  <div class="group">
    <div class="cell"><div class="t"><span style="font-size:15px;color:var(--fg)">${T('Subtotal')}</span></div><span class="price" style="font-weight:500">${money(t)}</span></div>
    <div class="cell"><div class="t"><span style="font-size:15px;color:var(--fg)">${T('GST')}</span></div><span class="price" style="font-weight:500">${money(gst)}</span></div>
    <div class="cell"><div class="t"><b>${T('Total')}</b></div><span class="price">${money(tot)}</span></div>
  </div>
  <div class="pad"><button class="btn" onclick="placeOrder()">${T(asap?'Place order':'Schedule order')} · ${money(tot)}</button></div>
  </div>` };

let oid = 1;
function placeOrder(){ const v = S.cartVenue, where = S.where, asap = S.when==='As soon as possible';
  const o = {id:oid++, venue:v, label:vname(v), where, mode: /Pick|Ramassage/.test(where) ? 'pickup' : 'deliver', state:0, eta: v==='pub'?14:v==='room'?25:6, sched: asap?null:S.when};
  S.orders.unshift(o); S.cart=[]; S.cartVenue=null; S.table=null; S.where=null; S.when=null; S.stacks.eat=[]; S.tab='home'; anim=''; render();
  if(o.sched){ notify('Order scheduled', `${o.label} · ${o.sched} · ${o.where}`); return }
  notify('Order received', `${o.label} · ${o.where}`); advance(o) }
function advance(o){ setTimeout(()=>{ o.state=1; o.eta=Math.max(2,o.eta-4); soft() }, 2600);
  setTimeout(()=>{ o.state=2; soft(); notify(o.mode==='deliver'?'Your order is on its way':'Your order is ready', o.where) }, 7000) }
function finish(id){ const o = S.orders.find(x=>x.id===id); o.state=3; soft(); openFoodback(o.label) }

V.eatclub = () => { const sw = S.sw; sw.pick ??= 0; sw.extras ??= new Set([0]);
  const V4 = ['Vegan','Vegetarian','Halal','Dairy-free','Nut-free'];
  const bread=[['Sourdough',V4],['Whole wheat wrap',['High fibre',...V4]],['Gluten-free bun',['Gluten-free',...V4]],['Bowl, no bread',['Low carb','Gluten-free',...V4]]];
  const prot=[['Turkey',['High protein','Halal','Gluten-free','Dairy-free','Nut-free']],['Roast beef',['High protein','Gluten-free','Dairy-free','Nut-free']],['Grilled chicken',['High protein','Halal','Gluten-free','Dairy-free','Nut-free']],['Egg salad',['Vegetarian','Halal','Gluten-free','Dairy-free','Nut-free']],['Falafel',['High fibre','Gluten-free',...V4]]];
  const firstFit = arr => Math.max(0, arr.findIndex(([,t])=>!fails(t).length));

  return `
  <div class="cover">${photo('lunchbag','bag')}${coverNav()}</div>
  <div class="stack" style="gap:18px">
  <div class="vhead"><h1>${T("Tomorrow's lunch")}</h1><div class="meta"><span>${T('Order by 20:00')}</span><span>·</span><span>${T('Included in your stay')}</span></div></div>

  <div><div class="glabel"><span>${T('Pickup')}</span></div><div class="group">${pick.map((n,i)=>`<button class="opt" role="radio" aria-checked="${sw.pick===i}" onclick="S.sw.pick=${i};soft()"><span class="mark">${I.check}</span><span class="t">${T(n)}</span></button>`).join('')}</div></div>
  <div class="pad"><button class="btn" ${bad?'disabled':''} onclick="eatClub(${sw.prot},${sw.bread},${sw.pick})">${T('Order lunch')}</button></div>

function eatClub(p, b, k){ const prot=['Turkey','Roast beef','Grilled chicken','Egg salad','Falafel'][p], bread=['Sourdough','Whole wheat wrap','Gluten-free bun','Bowl, no bread'][b];

}

V.service = d => { const s = SERVICES[d.id], k = d.id; S.sw['day'+k] ??= 0; S.sw['pk'+k] ??= 0;
  const di = S.sw['day'+k];
  const slots = k==='laundry' ? ['06:00','18:00'] : ['06:00','06:30','07:00','12:00','12:30','17:30','18:00','18:30','19:00','19:30','20:00','20:30'];
  const taken = new Set(di===0?['06:00','07:00','12:30','18:00','19:30']:['17:30','18:30']);
  if(di===0) slots.forEach(t=>{ if(t<clock()) taken.add(t) });
  S.bookings.forEach(b=>{ if(b.k===k && b.day===di && b!==S.resched) taken.add(b.t) });
  const sel = S.sw['slot'+k], picks = S.lang==='FR' && s.pickfr ? s.pickfr : s.pick;
  return `
  <div class="cover">${photo(s.img, s.icon)}${coverNav()}</div>
  <div class="stack" style="gap:20px">
  <div class="vhead"><h1>${T(s.n)}</h1><div class="meta"><span>${s.len}</span><span>·</span><span>${sprice(s)}</span></div><p>${esc(D(s))}</p></div>
  <div class="pad who">${s.place?`<div class="glyph" style="width:44px;height:44px;border-radius:50%">${I[s.icon]}</div>`:`<div class="avatar">${s.ini}</div>`}<b style="font-weight:600">${esc(swho(s))}</b></div>
  ${picks?`<div class="chips">${picks.map((p,i)=>`<button class="chip" aria-pressed="${S.sw['pk'+k]===i}" onclick="S.sw['pk${k}']=${i};soft()">${p}</button>`).join('')}</div>`:''}
  <div class="days">${[0,1,2,3,4,5,6].map(i=>{ const x = new Date(2026,10,16+i); return `<button class="day" aria-pressed="${di===i}" onclick="S.sw['day${k}']=${i};S.sw['slot${k}']=null;soft()"><small>${i===0?T('Today'):x.toLocaleDateString(locale(),{weekday:'short'})}</small><b>${x.getDate()}</b></button>`}).join('')}</div>
  <div class="slots">${slots.map(t=>`<button class="slot" ${taken.has(t)?'disabled':''} aria-pressed="${sel===t}" onclick="S.sw['slot${k}']='${t}';soft()">${t}</button>`).join('')}</div>
  <div class="pad"><button class="btn" ${sel?'':'disabled'} onclick="confirmBook('${k}')">${sel?`${T('Book')} · ${dayLabel(di)} ${sel}`:T('Choose a time')}</button></div>
  </div>` };
function confirmBook(k){ const s = SERVICES[k], di = S.sw['day'+k], t = S.sw['slot'+k];
  const picks = S.lang==='FR' && s.pickfr ? s.pickfr : s.pick, extra = picks ? ' · ' + picks[S.sw['pk'+k]] : '';
  const where = swho(s) + extra;
  if(S.resched && S.resched.k===k) S.bookings = S.bookings.filter(b=>b!==S.resched); S.resched = null;
  S.bookings.push({n:s.n, icon:s.icon, day:di, t, where, k}); S.sw['slot'+k]=null;
  openSheet(`<div class="body" style="padding-top:20px"><div class="done"><div class="ok">${I.check}</div><h3>${T("You're booked")}</h3><p>${esc(T(s.n))} · ${esc(dayLabel(di))} ${t}</p><p>${esc(where)}</p></div></div>
    <div class="foot"><button class="btn alt" onclick="closeSheet()">${I.calendar.replace('<svg','<svg width="20" height="20"')} ${T('Add to calendar')}</button><button class="btn" onclick="closeSheet();S.stacks.book=[];soft()">${T('Done')}</button></div>`);
  notify('Your appointment is confirmed', `${T(s.n)} · ${dayLabel(di)} ${t}`);
  if(k==='washer'||k==='laundry') setTimeout(()=>notify(k==='washer'?'Your washer is done':'Your laundry is back', k==='washer'?'#4':T('Room')+' 123'), 9000) }
function manage(i){ const b = S.bookings[i];
  openSheet(`<div class="body" style="padding-top:26px"><div class="stack" style="gap:16px"><div class="pad"><h3>${esc(T(b.n))}</h3><p style="margin:6px 0 0;color:var(--fg2)">${esc(dayLabel(b.day))} · ${b.t} · ${esc(b.whereFn?b.whereFn():b.where)}</p></div>

    <button class="cell" style="--inset:58px" onclick="back();openFoodback('${T('Dining Hall')} · ${T('Lunch')}')"><div class="glyph">${I.star}</div><div class="t"><b>Foodback</b><span>${T('Dining Hall')}</span></div>${I.chev}</button>
  </div></div></div>`;
function scanTable(){ S.table = `${T('Patio')} · ${T('Table 14')}`; S.where = S.table; Object.keys(S.stacks).forEach(k=>S.stacks[k]=[]); S.tab='eat'; S.menuTab.pub='Patio BBQ'; go('venue',{id:'pub', title:vname('pub')}) }

V.notes = () => { S.unread = 0;
  return `${navbar('Notifications')}<div class="stack">${S.notes.length?`<div class="group">${S.notes.map(n=>`<div class="cell" style="--inset:56px"><div class="glyph" style="font-size:9px;font-weight:700;overflow:hidden">${appIcon()}</div><div class="t"><b>${esc(T(n.title))}</b><span>${esc(n.body)}</span></div><span style="color:var(--fg3);font-size:12px;align-self:flex-start;margin-top:3px">${n.at}</span></div>`).join('')}</div>`:`<div class="pad" style="color:var(--fg2);text-align:center;padding-top:40px">${T('No notifications')}</div>`}</div>` };

const NOTIF_DESC = {'Room ready':'When housekeeping finishes your room','Order updates':'Received, ready and on its way','Booking reminders':'An hour before appointments and classes','Menus and events':"Today's menu at 10:00 and new events"};
V.notifset = () => `${navbar('Notifications')}<div class="stack"><div class="group">${Object.keys(S.toggles).map(n=>`<div class="cell"><div class="t"><b style="font-weight:500">${T(n)}</b><span>${T(NOTIF_DESC[n])}</span></div><button class="switch" role="switch" aria-label="${T(n)}" aria-checked="${S.toggles[n]}" onclick="S.toggles['${n}']=!S.toggles['${n}'];soft()"></button></div>`).join('')}</div></div>`;

V.me = () => `<div class="stack">
  ${largeTitle(T('Me'))}
  <div class="pass">
    <div class="row"><div><small>${T('Resident')}</small><b>Jordan Reyes</b></div><div style="text-align:right"><small>${esc(B().mark)}</small><b>${esc(B().lodge)}</b></div></div>
    <div class="qrbox" id="qr"></div>
    <div class="cap">${T('Scan at the front desk, dining hall and gym')}</div>
    <div class="row"><div><small>${T('Room')}</small><b>${esc(B().block)} · 123</b></div><div style="text-align:right"><small>${T('Departs')}</small><b>${S.lang==='FR'?'30 nov.':'Nov 30'}</b></div></div>
  </div>
  <div class="h2"><h2>${T('Dietary profile')}</h2></div>
  <div><div class="glabel"><span>${T('Goals')}</span></div><div class="pad"><div class="wrapchips">${GOALS.map(d=>`<button class="chip" aria-pressed="${S.prefs.has(d)}" onclick="togglePref('${d}')">${T(d)}</button>`).join('')}</div></div></div>
  <div><div class="glabel"><span>${T('Requirements')}</span></div><div class="pad"><div class="wrapchips">${RULES.map(d=>`<button class="chip" aria-pressed="${S.prefs.has(d)}" onclick="togglePref('${d}')">${T(d)}</button>`).join('')}</div></div></div>
  <div class="h2"><h2>${T('Settings')}</h2></div>
  <div class="group">
    <button class="cell" onclick="go('notifset',{title:'Notifications'})"><div class="t"><b style="font-weight:500">${T('Notifications')}</b></div>${I.chev}</button>
    <div class="cell"><div class="t"><b style="font-weight:500">${T('Language')}</b></div><div class="seg2" style="width:110px">${['EN','FR'].map(l=>`<button aria-pressed="${S.lang===l}" onclick="S.lang='${l}';soft()">${l}</button>`).join('')}</div></div>
  </div></div>`;
function togglePref(d){ S.prefs.has(d)?S.prefs.delete(d):S.prefs.add(d); if(d==='Vegan' && S.prefs.has('Vegan')) S.prefs.add('Vegetarian'); save(); soft() }

/* ---------- render ---------- */
function render(){
  const c = cur(), html = c ? V[c.view](c.data) : V[S.tab]();
  $('#views').innerHTML = `<div class="view ${anim}">${html}</div>`; anim='';
  $('#status').classList.toggle('light', !!(c && ['venue','eatclub','service','event'].includes(c.view)));
  $('#tabbar').innerHTML = [['home','Home'],['eat','Eat'],['book','Book'],['me','Me']].map(([k,l])=>`<button aria-current="${S.tab===k?'page':'false'}" onclick="tab('${k}')">${I[k]}${T(l)}</button>`).join('');
  document.documentElement.lang = S.lang==='FR' ? 'fr-CA' : 'en-CA';
  const q = $('#qr'); if(q && window.QRCode){ new QRCode(q, {text:'CVL-RES-0412-ROT14', width:256, height:256, correctLevel:QRCode.CorrectLevel.M}) }
}

/* ---------- demo moments ---------- */
function reset(){ closeSheet(); Object.keys(S.stacks).forEach(k=>S.stacks[k]=[]); S.table=null; S.where=null; S.when=null; S.forYou=false; S.cart=[]; S.cartVenue=null; S.resched=null }
function moment(m){ reset();
  if(m==='arrive'){ clearTimeout(bootT); clearTimeout(S.arriveT); S.roomReady=false; S.tab='home'; anim=''; render(); S.arriveT = setTimeout(()=>{ S.roomReady=true; soft(); notify('Your room is ready', `${B().block} · ${T('Room')} 123`) }, 1800) }
  if(m==='table'){ scanTable() }
  if(m==='later'){ S.tab='eat'; go('venue',{id:'room', title:'Room Service'}) }
  if(m==='eatclub'){ S.tab='eat'; go('eatclub',{title:'Eat Club'}) }
  if(m==='massage'){ S.tab='book'; go('service',{id:'massage', title:'Massage'}) }
  if(m==='foodback'){ S.tab='eat'; go('venue',{id:'dining', title:'Dining Hall'}); setTimeout(()=>openFoodback(`${T('Dining Hall')} · ${T('Lunch')}`), 350) }
  if(m==='prefs'){ S.prefs = new Set(['High protein','Halal']); save(); S.tab='eat'; S.menuTab.dining='Lunch'; go('venue',{id:'dining', title:'Dining Hall'}) }
}
document.documentElement.dataset.brand = 'ess';
render();
const bootT = setTimeout(()=>{ if(!S.roomReady){ S.roomReady=true; soft(); notify('Your room is ready', `${B().block} · ${T('Room')} 123`) } }, 6000);
</script>
